name: "Build - macOS system audio idle fix"

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: macos-idle-fix-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  MACOSX_DEPLOYMENT_TARGET: "14.2"
  TARGET: aarch64-apple-darwin
  ORIGINAL_COMMIT: 10f11baed5e0dbc9c1e885d22534a6dec19dbb57
  APPLE_SIGNING_IDENTITY: "-"

jobs:
  build-macos:
    name: Native regressions and Apple Silicon candidate
    # Execute PR code only for branches in this repository, without release secrets.
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: macos-15
    timeout-minutes: 120

    steps:
      - name: Checkout exact candidate commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify runner and candidate ancestry
        id: candidate
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -m)" = arm64
          git cat-file -e "$ORIGINAL_COMMIT^{commit}"
          git merge-base --is-ancestor "$ORIGINAL_COMMIT" HEAD
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          test -f Cargo.lock
          test -f frontend/pnpm-lock.yaml

      - name: Set up pnpm
        uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 11.9.0

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.97.1
          targets: aarch64-apple-darwin
          components: rustfmt

      - name: Cache Rust builds
        uses: swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
        with:
          workspaces: ". -> target"
          key: macos-idle-fix-aarch64-openssl3-v1

      - name: Prepare native prerequisites
        shell: bash
        run: |
          set -euo pipefail
          for formula in cmake pkg-config openssl@3; do
            if ! brew list --versions "$formula" >/dev/null; then
              brew install "$formula"
            fi
          done
          OPENSSL_PREFIX=$(brew --prefix openssl@3)
          test -f "$OPENSSL_PREFIX/include/openssl/err.h"
          {
            echo "OPENSSL_DIR=$OPENSSL_PREFIX"
            echo "OPENSSL_ROOT_DIR=$OPENSSL_PREFIX"
            echo "CMAKE_PREFIX_PATH=$OPENSSL_PREFIX"
            echo "CPPFLAGS=-I$OPENSSL_PREFIX/include"
            echo "CFLAGS=-I$OPENSSL_PREFIX/include"
            echo "CXXFLAGS=-I$OPENSSL_PREFIX/include"
            echo "LDFLAGS=-L$OPENSSL_PREFIX/lib"
            echo "PKG_CONFIG_PATH=$OPENSSL_PREFIX/lib/pkgconfig"
          } >> "$GITHUB_ENV"

      - name: Install frontend dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Build Apple Silicon llama-helper
        shell: bash
        run: |
          set -euo pipefail
          cargo build --locked --release --package llama-helper --target "$TARGET" --features metal
          mkdir -p frontend/src-tauri/binaries
          cp "target/$TARGET/release/llama-helper" "frontend/src-tauri/binaries/llama-helper-$TARGET"
          chmod +x "frontend/src-tauri/binaries/llama-helper-$TARGET"

      # These steps are deliberately separate and sequential. Next writes frontend/out,
      # which native tests embed; Bun mocks must not leak between test groups.
      - name: Build frontend
        working-directory: frontend
        run: pnpm run build

      - name: Check frontend types
        working-directory: frontend
        run: pnpm exec tsc --noEmit

      - name: Test permission results and consumers
        working-directory: frontend
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          permission_tests=(./tests/permissions/*.test.ts ./tests/permissions/*.test.tsx)
          test "${#permission_tests[@]}" -gt 0
          for test_file in "${permission_tests[@]}"; do
            pnpm dlx bun@1.3.10 test "$test_file"
          done

      - name: Test audio meter lifecycle
        working-directory: frontend
        run: pnpm dlx bun@1.3.10 test ./tests/audio-levels/lifecycle.test.tsx

      - name: Run native macOS audio regressions
        working-directory: frontend/src-tauri
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -m)" = arm64
          # build/ffmpeg.rs prepares the FFmpeg sidecar during the native build.
          for filter in audio::stream core_audio audio::permissions audio::pipeline; do
            cargo test --locked -p meetily --lib --target "$TARGET" "$filter" -- --nocapture
          done

      - name: Build ad-hoc signed DMG
        working-directory: frontend
        shell: bash
        run: |
          set -euo pipefail
          pnpm exec tauri build --target "$TARGET" --config src-tauri/tauri.macos.conf.json --bundles dmg -- --locked
          git diff --exit-code -- ../Cargo.lock pnpm-lock.yaml

      - name: Verify and package candidate
        shell: bash
        env:
          BUILD_COMMIT: ${{ steps.candidate.outputs.commit }}
        run: |
          set -euo pipefail
          VERSION=$(node -p "require('./frontend/src-tauri/tauri.conf.json').version")
          test "$VERSION" = "0.2.18"
          assert_macos_compatible() {
            local binary="$1"
            local min_os
            min_os=$(xcrun vtool -arch arm64 -show-build "$binary" 2>/dev/null \
              | awk '$1 == "minos" { print $2; exit }' || true)
            if [[ -z "$min_os" ]]; then
              min_os=$(otool -arch arm64 -l "$binary" | awk '
                $1 == "cmd" && $2 == "LC_VERSION_MIN_MACOSX" { legacy = 1; next }
                legacy && $1 == "version" { print $2; exit }
              ')
            fi
            if [[ -z "$min_os" ]]; then
              echo "Could not determine the Mach-O deployment target: $binary"
              exit 1
            fi
            python3 - "$binary" "$min_os" <<'PY'
          import sys

          binary, version = sys.argv[1:]
          parts = tuple(int(part) for part in version.split("."))
          padded = (parts + (0, 0, 0))[:3]
          if padded > (14, 2, 0):
              raise SystemExit(f"{binary} requires macOS {version}, later than 14.2")
          print(f"{binary}: Mach-O minimum macOS {version}")
          PY
          }

          BUNDLE_DIR="target/$TARGET/release/bundle"
          DMG_PATH=$(find "$BUNDLE_DIR/dmg" -maxdepth 1 -name "*.dmg" -type f -print -quit)

          if [[ -z "$DMG_PATH" ]]; then
            echo "The expected DMG was not produced."
            exit 1
          fi

          MOUNT_POINT="$RUNNER_TEMP/meetily-dmg"
          mkdir -p "$MOUNT_POINT"
          hdiutil attach "$DMG_PATH" -nobrowse -readonly -mountpoint "$MOUNT_POINT"
          trap 'hdiutil detach "$MOUNT_POINT" >/dev/null 2>&1 || true' EXIT

          APP_PATH=$(find "$MOUNT_POINT" -maxdepth 1 -name "*.app" -type d -print -quit)
          if [[ -z "$APP_PATH" ]]; then
            echo "The DMG does not contain an app bundle."
            exit 1
          fi

          APP_BINARY="$APP_PATH/Contents/MacOS/meetily"
          if [[ ! -x "$APP_BINARY" ]]; then
            echo "App executable not found: $APP_BINARY"
            exit 1
          fi
          file "$APP_BINARY" | grep -q "arm64"
          assert_macos_compatible "$APP_BINARY"

          for sidecar in \
            "$APP_PATH/Contents/MacOS/llama-helper" \
            "$APP_PATH/Contents/MacOS/ffmpeg"; do
            if [[ ! -x "$sidecar" ]]; then
              echo "Missing executable sidecar: $sidecar"
              exit 1
            fi
            file "$sidecar" | grep -q "arm64"
            assert_macos_compatible "$sidecar"
          done

          "$APP_PATH/Contents/MacOS/ffmpeg" -version
          FFMPEG_TEST="$RUNNER_TEMP/ffmpeg-smoke.m4a"
          "$APP_PATH/Contents/MacOS/ffmpeg" \
            -f lavfi -i "anullsrc=r=48000:cl=mono" \
            -t 0.25 -c:a aac -y "$FFMPEG_TEST"
          test -s "$FFMPEG_TEST"
          FFMPEG_DECODED="$RUNNER_TEMP/ffmpeg-smoke.f32"
          "$APP_PATH/Contents/MacOS/ffmpeg" \
            -v error -i "$FFMPEG_TEST" \
            -f f32le -acodec pcm_f32le -y "$FFMPEG_DECODED"
          test -s "$FFMPEG_DECODED"

          LLAMA_OUTPUT=$(printf '%s\n' '{"type":"ping"}' '{"type":"shutdown"}' \
            | "$APP_PATH/Contents/MacOS/llama-helper")
          echo "$LLAMA_OUTPUT"
          grep -q '"type":"pong"' <<< "$LLAMA_OUTPUT"
          grep -q '"type":"goodbye"' <<< "$LLAMA_OUTPUT"

          test -f "$APP_PATH/Contents/Resources/icon.icns"
          test -f "$APP_PATH/Contents/Resources/templates/standard_meeting.json"
          test -f "$APP_PATH/Contents/Resources/resources/diarization/segmentation-3.0-fp16.onnx"
          test -f "$APP_PATH/Contents/Resources/resources/diarization/wespeaker-resnet34-LM.onnx"
          test -f "$APP_PATH/Contents/Resources/resources/diarization/xvec_transform.npz"

          INFO_PLIST="$APP_PATH/Contents/Info.plist"
          test -n "$(/usr/libexec/PlistBuddy -c 'Print :NSMicrophoneUsageDescription' "$INFO_PLIST")"
          test -n "$(/usr/libexec/PlistBuddy -c 'Print :NSAudioCaptureUsageDescription' "$INFO_PLIST")"
          MINIMUM_VERSION=$(/usr/libexec/PlistBuddy -c 'Print :LSMinimumSystemVersion' "$INFO_PLIST")
          test "$MINIMUM_VERSION" = "14.2"

          ENTITLEMENTS_PATH="$RUNNER_TEMP/meetily-entitlements.plist"
          codesign -d --entitlements :- "$APP_PATH" > "$ENTITLEMENTS_PATH"
          python3 - "$ENTITLEMENTS_PATH" <<'PY'
          import plistlib
          import sys

          with open(sys.argv[1], "rb") as entitlements_file:
              actual = plistlib.load(entitlements_file)
          expected = {"com.apple.security.device.audio-input": True}
          if actual != expected:
              raise SystemExit(f"Unexpected entitlements: {actual!r}")
          PY

          codesign --verify --deep --strict "$APP_PATH"
          SIGN_DETAILS=$(codesign -dv --verbose=4 "$APP_PATH" 2>&1)
          grep -q '^Signature=adhoc$' <<< "$SIGN_DETAILS"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$INFO_PLIST")" = "com.meetily.ai"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$INFO_PLIST")" = "$VERSION"

          mkdir -p dist
          ARTIFACT_STEM="Meetily-Actually-Free_${VERSION}_idle-fix_${BUILD_COMMIT:0:12}_aarch64"
          cp "$DMG_PATH" "dist/$ARTIFACT_STEM.dmg"
          # ditto preserves the .app directory, symlinks, executable bits and resources.
          ditto -c -k --sequesterRsrc --keepParent "$APP_PATH" "dist/$ARTIFACT_STEM.app.zip"
          hdiutil detach "$MOUNT_POINT"
          trap - EXIT

          git diff --binary --full-index "$ORIGINAL_COMMIT" "$BUILD_COMMIT" > dist/idle-fix.patch
          record_version() {
            local tool_label="$1"
            shift
            printf '\n[%s]\n' "$tool_label"
            "$@"
          }
          {
            record_version node node --version
            record_version pnpm pnpm --version
            record_version cargo cargo --version
            record_version rustc rustc --version --verbose
            (cd frontend && record_version tauri pnpm exec tauri --version)
            (cd frontend && record_version bun pnpm dlx bun@1.3.10 --version)
            record_version cmake cmake --version
            record_version pkg-config pkg-config --version
            record_version openssl "$OPENSSL_DIR/bin/openssl" version
            record_version xcode xcodebuild -version
            record_version macos sw_vers
          } > dist/tool-versions.txt
          jq -n \
            --arg version "$VERSION" \
            --arg original_commit "$ORIGINAL_COMMIT" \
            --arg build_commit "$BUILD_COMMIT" \
            --arg event_commit "$GITHUB_SHA" \
            --arg repository "$GITHUB_REPOSITORY" \
            --arg run_url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            --arg run_attempt "$GITHUB_RUN_ATTEMPT" \
            --arg patch_sha256 "$(shasum -a 256 dist/idle-fix.patch | awk '{print $1}')" \
            --rawfile tool_versions dist/tool-versions.txt \
            '{
              version: $version,
              bundle_identifier: "com.meetily.ai",
              original_commit: $original_commit,
              build_commit: $build_commit,
              event_commit: $event_commit,
              repository: $repository,
              run_url: $run_url,
              run_attempt: $run_attempt,
              patch: "idle-fix.patch",
              patch_sha256: $patch_sha256,
              tool_versions: $tool_versions,
              target: "aarch64-apple-darwin",
              minimum_macos: "14.2",
              signing: "ad-hoc",
              notarized: false,
              physical_core_audio_verified: false
            }' > dist/macos-build-metadata.json
          (cd dist && shasum -a 256 *.dmg *.app.zip idle-fix.patch tool-versions.txt macos-build-metadata.json > SHA256SUMS)
          {
            echo "Candidate commit: $BUILD_COMMIT"
            echo "Base commit: $ORIGINAL_COMMIT"
            echo "Native synthetic regressions and bundle checks passed."
            echo "Physical Core Audio capture and saved-track synchronization require hardware testing."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload candidate artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: meetily-idle-fix-${{ steps.candidate.outputs.commit }}-macos-aarch64
          path: |
            dist/*.dmg
            dist/*.app.zip
            dist/SHA256SUMS
            dist/idle-fix.patch
            dist/tool-versions.txt
            dist/macos-build-metadata.json
          if-no-files-found: error
          retention-days: 30
