name: PR frontend checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: frontend-checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  frontend:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      PNPM_CONFIG_ENABLE_GLOBAL_VIRTUAL_STORE: 'false'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa
        with:
          version: 11.9.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Run existing frontend tests in isolated processes
        shell: bash
        run: |
          set -euo pipefail
          # Global window and Tauri mocks must not leak across test files.
          while IFS= read -r -d '' test_file; do
            pnpm dlx bun@1.3.10 test "$test_file"
          done < <(find tests/lib tests/hooks tests/chat tests/codex-cli tests/meeting-detection -type f \( -name '*.test.js' -o -name '*.test.mjs' -o -name '*.test.ts' -o -name '*.test.tsx' \) -print0 | sort -z)
      - run: pnpm run build
      - run: pnpm exec tsc --noEmit
